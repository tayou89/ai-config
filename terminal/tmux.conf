# Shared tmux settings for Claude Code, installed as ~/.claude/terminal/tmux.conf.
# Each computer's ~/.tmux.conf loads it with one line:
#   source-file ~/.claude/terminal/tmux.conf

# Claude Code's desktop notification passes through from every pane of an attached
# session, including windows not being viewed (tmux 3.4 or later). `all` lets other
# sequences such programs wrap for the outer terminal through too.
set -g allow-passthrough all
set -g focus-events on

# Shift+Enter inserts a newline in Claude Code (terminal configuration docs, "Configure tmux").
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# scripts/tmux-window-mark-hook.py rings the bell in a waiting Claude Code pane: tmux flags
# that window in the status bar and, with bell-action none, sends the terminal no second alert.
set -g monitor-bell on
set -g bell-action none
set -g visual-bell off

# Scroll and pick panes with the mouse, and keep long Claude Code output in scrollback.
set -g mouse on
set -g history-limit 50000

# Window and pane numbers start at 1 and stay gapless, matching the number keys.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Esc reaches Claude Code at once instead of waiting to see whether it starts an Alt key.
set -sg escape-time 10
