# Shared Ghostty settings, installed as ~/.claude/terminal/ghostty.conf.
# Each computer's Ghostty config loads it with one line:
#   config-file = ~/.claude/terminal/ghostty.conf

# Option works as Alt for Claude Code's Option shortcuts (terminal configuration docs).
macos-option-as-alt = true

# Reopen the same windows and tabs after Ghostty or the Mac restarts.
window-save-state = always
